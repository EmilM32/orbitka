<!doctype html>
<html lang="pl" data-quality="med">
  <head>
    <meta charset="utf-8" />
    <title>Orbitka · Obserwatorium FINAL · tablet, start dotykowy</title>
    <meta name="viewport" content="width=768,initial-scale=1" />
    <!-- Makieta statyczna (7.10.2026). Stany hover/fokus wymuszone klasami is-*. Treści kart oznaczone jako przykładowe. -->
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 768px;
        height: 1024px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="stage" style="width: 768px; height: 1024px">
      <img class="scene" src="../scene/start-768x1024-med.png" alt="" />
      <div class="labels">
        <svg class="leaders" width="100%" height="100%">
          <line x1="384" y1="512" x2="370" y2="568" />
          <line x1="393" y1="534" x2="468" y2="556" />
          <line x1="427" y1="512" x2="486" y2="526" />
          <line x1="433" y1="505" x2="480" y2="490" />
          <line x1="386" y1="476" x2="386" y2="450" /></svg
        ><span class="pill" style="left: 370px; top: 568px"
          ><span class="dot" style="background: #fdb813"></span>Słońce</span
        ><span class="pill" style="left: 468px; top: 556px"
          ><span class="dot" style="background: #9c9c9c"></span>Merkury</span
        ><span class="pill" style="left: 486px; top: 526px"
          ><span class="dot" style="background: #e6c88a"></span>Wenus</span
        ><span class="pill" style="left: 480px; top: 490px"
          ><span class="dot" style="background: #3a78c2"></span>Ziemia</span
        ><span class="pill" style="left: 386px; top: 450px"
          ><span class="dot" style="background: #c1440e"></span>Mars</span
        ><span class="pill" style="left: 552px; top: 472px"
          ><span class="dot" style="background: #e3cc8f"></span>Saturn</span
        ><span class="pill" style="left: 475px; top: 388px"
          ><span class="dot" style="background: #7fd6e0"></span>Uran</span
        ><span class="pill" style="left: 659px; top: 486px"
          ><span class="dot" style="background: #3f5fd0"></span>Neptun</span
        ><span class="pill" style="left: 300px; top: 440px"
          ><span class="dot" style="background: #d2a679"></span>Jowisz</span
        >
      </div>
      <div class="brand" style="left: 16px; top: 14px; font-size: 22px">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <radialGradient id="sg" cx="40%" cy="38%">
              <stop offset="0" stop-color="#fff3c4" />
              <stop offset=".55" stop-color="#ffc24b" />
              <stop offset="1" stop-color="#e98a12" />
            </radialGradient>
          </defs>
          <ellipse
            cx="20"
            cy="20"
            rx="17"
            ry="7.5"
            fill="none"
            stroke="#8cc8ff"
            stroke-width="2"
            transform="rotate(-18 20 20)"
          />
          <circle cx="20" cy="20" r="7" fill="url(#sg)" />
          <circle cx="34.6" cy="14.6" r="2.6" fill="#f2f4fa" /></svg
        >Orbitka
      </div>
      <div
        class="toolbar glass"
        role="group"
        aria-label="Widok"
        style="right: 16px; top: 12px"
      >
        <button class="btn">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="2.6" fill="currentColor" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="9.6" stroke-dasharray="2.5 2.8" /></svg
          >Cały układ</button
        ><button class="btn toggle" aria-pressed="true">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <ellipse cx="12" cy="12" rx="10" ry="5.2" />
            <circle cx="19.6" cy="10" r="1.8" fill="currentColor" /></svg
          >Orbity<span class="switch" aria-hidden="true"></span></button
        ><span class="sep"></span
        ><button class="btn" aria-label="Oddal">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
          </svg></button
        ><button class="btn" aria-label="Przybliż">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>
      <button
        class="btn glass"
        aria-expanded="false"
        style="
          position: absolute;
          z-index: 20;
          left: 16px;
          top: 68px;
          border-radius: 999px;
          padding: 0 16px;
        "
      >
        <svg
          class="ic"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 6h11M9 12h11M9 18h11" />
          <circle cx="4.5" cy="6" r="1.2" fill="currentColor" />
          <circle cx="4.5" cy="12" r="1.2" fill="currentColor" />
          <circle cx="4.5" cy="18" r="1.2" fill="currentColor" /></svg
        >Ciała
      </button>
      <div class="chip glass" style="left: 124px; top: 72px">
        <svg
          class="ic"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5.5" />
          <circle
            cx="12"
            cy="7.6"
            r="1.1"
            fill="currentColor"
            stroke="none"
          /></svg
        >Skala uproszczona<button class="why" aria-haspopup="dialog">
          Dlaczego?
        </button>
      </div>
      <section
        class="coach glass"
        role="region"
        aria-labelledby="coach-t"
        style="left: 16px; top: 722px; width: 736px"
      >
        <div class="coach-head">
          <h2 id="coach-t">Trening pilota</h2>
          <span class="count" aria-live="polite">0/3</span
          ><span class="bars" aria-hidden="true"
            ><i class=""></i><i class=""></i><i class=""></i></span
          ><button class="btn ghost sm skip">Pomiń</button>
        </div>
        <ol class="steps">
          <li class="cstep is-current" aria-current="step">
            <span class="tick"
              ><svg
                class="ic"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-.5V6.5a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.6 13a1.5 1.5 0 0 1 2.5-1.7L9 14"
                /></svg></span
            ><span class="t"
              ><b>Obróć widok</b><span>przeciągnij palcem</span></span
            >
          </li>
          <li class="cstep">
            <span class="tick"
              ><svg
                class="ic"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 7l-3-3M4 8V4h4M17 17l3 3M20 16v4h-4" />
                <circle cx="12" cy="12" r="2.5" /></svg></span
            ><span class="t"><b>Przybliż</b><span>rozsuń dwa palce</span></span>
          </li>
          <li class="cstep">
            <span class="tick"
              ><svg
                class="ic"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 3.5l12.5 6.2-5.6 1.7-2.2 5.6z" />
                <path d="M13.6 12.4 18 17" /></svg></span
            ><span class="t"
              ><b>Wybierz planetę</b><span>dotknij jej na niebie</span></span
            >
          </li>
        </ol>
      </section>
      <section
        class="dock glass"
        aria-label="Sterowanie czasem"
        style="
          position: absolute;
          left: 16px;
          top: 866px;
          width: 736px;
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
          padding: 10px 14px 12px 10px;
          border-radius: 24px;
        "
      >
        <div class="dock-row">
          <button class="play" aria-label="Pauza">
            <svg
              class="ic"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect
                x="6.5"
                y="5"
                width="3.6"
                height="14"
                rx="1"
                fill="currentColor"
                stroke="none"
              />
              <rect
                x="13.9"
                y="5"
                width="3.6"
                height="14"
                rx="1"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
          <div class="date">
            <span class="d" aria-live="off">7 października 2026</span
            ><span class="s">1 dzień/s</span>
          </div>
          <span style="flex: 1"></span
          ><button class="btn outline" aria-pressed="false">
            <svg
              class="ic"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
              <path d="M3.5 4v4.6h4.6" /></svg
            >Wstecz
          </button>
        </div>
        <div class="dock-row" style="gap: 16px">
          <div
            class="segs"
            role="radiogroup"
            aria-label="Prędkość czasu na sekundę"
          >
            <span class="seg is-active" role="radio" aria-checked="true"
              >1 dzień</span
            ><span class="seg" role="radio" aria-checked="false">10 dni</span
            ><span class="seg" role="radio" aria-checked="false">1 mies.</span
            ><span class="seg" role="radio" aria-checked="false">1 rok</span>
          </div>
          <div style="flex: 1; display: flex">
            <div
              class="slider"
              role="slider"
              aria-label="Prędkość czasu"
              style="width: 100%"
            >
              <span class="track"></span
              ><span class="fill" style="width: 18%"></span
              ><span class="thumb" style="left: 18%"></span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
