name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries ship in the image, so the job never
    # runs apt-get (the Ubuntu mirror hung `playwright install --with-deps`).
    # The tag must match @playwright/test in package.json (tests/repo/ci.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
      # Runs tests/e2e/visual.spec.ts: its baselines come from this image.
      ORBITKA_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run test:e2e
        timeout-minutes: 8
      # On failure the HTML report holds expected, actual and diff images of
      # every failed visual snapshot. CI never refreshes the baselines.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
