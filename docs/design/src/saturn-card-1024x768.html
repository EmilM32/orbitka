<!doctype html>
<html lang="pl" data-quality="med">
  <head>
    <meta charset="utf-8" />
    <title>
      Orbitka · Obserwatorium FINAL · 1024×768, Saturn, arkusz zwinięty
    </title>
    <meta name="viewport" content="width=1024,initial-scale=1" />
    <!-- Makieta statyczna (7.10.2026). Stany hover/fokus wymuszone klasami is-*. Treści kart oznaczone jako przykładowe. -->
    <link rel="stylesheet" href="../../../src/ui/tokens.css" />
    <link rel="stylesheet" href="../../../src/style.css" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 768px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="stage" style="width: 1024px; height: 768px">
      <img class="scene" src="../scene/saturn-1024x768-med.png" alt="" />
      <div class="labels">
        <span class="pill is-selected" style="left: 512px; top: 86px"
          ><span class="dot" style="background: #e3cc8f"></span>Saturn</span
        >
      </div>
      <div class="brand" style="left: 16px; top: 14px; font-size: 22px">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <radialGradient id="sg" cx="40%" cy="38%">
              <stop offset="0" stop-color="#fff3c4" />
              <stop offset=".55" stop-color="#ffc24b" />
              <stop offset="1" stop-color="#e98a12" />
            </radialGradient>
          </defs>
          <ellipse
            cx="20"
            cy="20"
            rx="17"
            ry="7.5"
            fill="none"
            stroke="#8cc8ff"
            stroke-width="2"
            transform="rotate(-18 20 20)"
          />
          <circle cx="20" cy="20" r="7" fill="url(#sg)" />
          <circle cx="34.6" cy="14.6" r="2.6" fill="#f2f4fa" /></svg
        >Orbitka
      </div>
      <div
        class="toolbar glass"
        role="group"
        aria-label="Widok"
        style="right: 16px; top: 12px"
      >
        <button class="btn">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="2.6" fill="currentColor" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="9.6" stroke-dasharray="2.5 2.8" /></svg
          >Cały układ</button
        ><button class="btn toggle" aria-pressed="true">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <ellipse cx="12" cy="12" rx="10" ry="5.2" />
            <circle cx="19.6" cy="10" r="1.8" fill="currentColor" /></svg
          >Orbity<span class="switch" aria-hidden="true"></span></button
        ><span class="sep"></span
        ><button class="btn" aria-label="Oddal">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
          </svg></button
        ><button class="btn" aria-label="Przybliż">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>
      <button
        class="btn glass"
        aria-expanded="false"
        style="
          position: absolute;
          z-index: 20;
          left: 16px;
          top: 68px;
          border-radius: 999px;
          padding: 0 16px;
        "
      >
        <svg
          class="ic"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 6h11M9 12h11M9 18h11" />
          <circle cx="4.5" cy="6" r="1.2" fill="currentColor" />
          <circle cx="4.5" cy="12" r="1.2" fill="currentColor" />
          <circle cx="4.5" cy="18" r="1.2" fill="currentColor" /></svg
        >Ciała
      </button>
      <div class="chip glass" style="left: 124px; top: 72px">
        <svg
          class="ic"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5.5" />
          <circle
            cx="12"
            cy="7.6"
            r="1.1"
            fill="currentColor"
            stroke="none"
          /></svg
        >Skala uproszczona<button class="why" aria-haspopup="dialog">
          Dlaczego?
        </button>
      </div>
      <section
        class="card glass"
        aria-labelledby="card-title"
        style="
          left: 16px;
          top: 560px;
          width: 992px;
          height: 112px;
          padding: 10px 16px 14px;
          gap: 6px;
        "
      >
        <button
          class="grabber"
          style="border: 0; padding: 0; margin: 0 0 2px"
          aria-label="Rozwiń kartę"
        ></button>
        <div style="display: flex; align-items: center; gap: 20px">
          <div style="width: 170px; flex: none">
            <h2 id="card-title" style="font-size: 26px">Saturn</h2>
            <div class="kind" style="margin-top: 4px">
              <span class="dot" style="background: #e3cc8f"></span>gazowy
              olbrzym
            </div>
          </div>
          <div style="flex: 1; min-width: 0">
            <div
              class="meter"
              role="img"
              aria-label="Średnica: Saturn 9,1 razy średnica Ziemi"
            >
              <div class="meter-head">
                <span class="k">Średnica</span
                ><span class="v">9,1 × Ziemia</span>
              </div>
              <div class="mrow">
                <span class="n">Saturn</span>
                <div class="mbar track">
                  <span
                    class="b"
                    style="width: 100%; background: #e3cc8f"
                  ></span
                  ><span
                    class="ticks"
                    style="
                      background-image: linear-gradient(
                        to right,
                        transparent calc(100% - 2px),
                        rgba(5, 7, 13, 0.75) 0
                      );
                      background-size: 10.941% 100%;
                    "
                  ></span>
                </div>
              </div>
              <div class="mrow">
                <span class="n">Ziemia</span>
                <div class="mbar track">
                  <span class="b earth" style="width: 10.941%"></span>
                </div>
              </div>
            </div>
          </div>
          <div class="card-actions" style="flex: none">
            <button class="btn outline">
              <svg
                class="ic"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="2.6" fill="currentColor" />
                <circle cx="12" cy="12" r="6" />
                <circle
                  cx="12"
                  cy="12"
                  r="9.6"
                  stroke-dasharray="2.5 2.8"
                /></svg
              >Cały układ</button
            ><button class="btn primary">
              Więcej<svg
                class="ic"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </div>
      </section>
      <section
        class="dock glass"
        aria-label="Sterowanie czasem"
        style="position: absolute; left: 16px; top: 684px; width: 992px"
      >
        <button class="play" aria-label="Pauza">
          <svg
            class="ic"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="6.5"
              y="5"
              width="3.6"
              height="14"
              rx="1"
              fill="currentColor"
              stroke="none"
            />
            <rect
              x="13.9"
              y="5"
              width="3.6"
              height="14"
              rx="1"
              fill="currentColor"
              stroke="none"
            />
          </svg>
        </button>
        <div class="date">
          <span class="d" aria-live="off">7 października 2026</span
          ><span class="s">1 dzień/s</span>
        </div>
        <div
          class="segs"
          role="radiogroup"
          aria-label="Prędkość czasu na sekundę"
        >
          <span class="seg is-active" role="radio" aria-checked="true"
            >1 dzień</span
          ><span class="seg" role="radio" aria-checked="false">10 dni</span
          ><span class="seg" role="radio" aria-checked="false">1 mies.</span
          ><span class="seg" role="radio" aria-checked="false">1 rok</span>
        </div>
        <button class="btn outline" aria-pressed="false">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
            <path d="M3.5 4v4.6h4.6" /></svg
          >Wstecz
        </button>
        <div
          class="slider"
          role="slider"
          aria-label="Prędkość czasu"
          style="width: 150px"
        >
          <span class="track"></span
          ><span class="fill" style="width: 18%"></span
          ><span class="thumb" style="left: 18%"></span>
        </div>
      </section>
    </main>
  </body>
</html>
